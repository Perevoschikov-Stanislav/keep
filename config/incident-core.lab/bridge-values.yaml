image:
  repository: keep-mm-bridge
  tag: transport-v1
  pullPolicy: Never
configuration:
  schema_version: 1
  tenant_id: keep
  transport_ref: mattermost-core
  keep_api_url: http://keep-backend:8080
  keep_ui_url: http://localhost:8000
  mattermost_url: http://mattermost:8065
  transport_token_ref: env:BRIDGE_TRANSPORT_TOKEN
  service_token_ref: env:KEEP_BRIDGE_SERVICE_TOKEN
  mattermost_token_ref: env:MM_BOT_TOKEN
  state_db: /state/transport.db
  timeout_seconds: 2
  reconcile_interval_seconds: 10
  recovery_page_size: 100
  recovery_max_pages: 10
  max_body_bytes: 524288
  destinations:
    ops-integration-customer-a-incidents:
      team_id: ops
      channel_id: examplechannel000000000007
      silence_service_posts: true
    ops-integration-customer-b-incidents:
      team_id: ops
      channel_id: examplechannel000000000004
      silence_service_posts: true
    ops-customer-a-incidents:
      team_id: ops
      channel_id: examplechannel000000000011
      silence_service_posts: true
    ops-customer-b-incidents:
      team_id: ops
      channel_id: examplechannel000000000001
      silence_service_posts: true
    ops-cloud-incidents:
      team_id: ops
      channel_id: examplechannel000000000012
      silence_service_posts: true
    ops-test-incidents-it:
      team_id: ops
      channel_id: examplechannel000000000008
      silence_service_posts: true
    it-test-incidents-it:
      team_id: it
      channel_id: examplechannel000000000008
      silence_service_posts: true
secretRefs:
  transport:
    name: keep-core-bridge
    key: transport
  service:
    name: keep-core-bridge
    key: service
  mattermost:
    name: keep-mm-bridge
    key: MM_BOT_TOKEN
persistence:
  enabled: true
  size: 1Gi
  storageClassName: null
resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    memory: 256Mi
