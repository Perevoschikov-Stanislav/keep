- id: route-5
  team_ids:
  - ops
  priority: 995
  match: normalized.cluster in ["infra-cluster"] && normalized.namespace == "prod"
    && incident.created_at >= "2026-10-08T05:22:12Z"
  event_types:
  - incident.created
  - incident.updated
  - incident.acknowledged
  - incident.resolved
  - incident.reopened
  - incident.escalated
  - incident.reminder
  destination_refs:
  - ops-cloud-incidents
