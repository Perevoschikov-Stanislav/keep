service_clients:
- id: mattermost-core-recovery
  auth_ref: env:KEEP_BRIDGE_SERVICE_TOKEN
  origin: notification-recovery
  team_ids:
  - ops
  - it
  scopes:
  - read:incident
  - read:silence
  - update:notification
  proof_profile_refs: []
dispatch:
  lease_seconds: 90
