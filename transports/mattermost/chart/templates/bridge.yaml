apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
data:
  bridge.json: {{ .Values.configuration | toJson | quote }}
---
{{- if .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-state
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.persistence.storageClassName }}
  storageClassName: {{ .Values.persistence.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}}
      annotations:
        checksum/config: {{ .Values.configuration | toJson | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65534, fsGroup: 65534}
      containers:
        - name: bridge
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{containerPort: 8080}]
          env:
            - {name: BRIDGE_CONFIG_FILE, value: /configuration/bridge.json}
            {{- range $env, $ref := dict "BRIDGE_TRANSPORT_TOKEN" .Values.secretRefs.transport "KEEP_BRIDGE_SERVICE_TOKEN" .Values.secretRefs.service "MM_BOT_TOKEN" .Values.secretRefs.mattermost }}
            - name: {{ $env }}
              valueFrom:
                secretKeyRef: {name: {{ $ref.name }}, key: {{ $ref.key }}}
            {{- end }}
          readinessProbe:
            httpGet: {path: /healthcheck, port: 8080}
          livenessProbe:
            httpGet: {path: /healthcheck, port: 8080}
          resources:
{{ .Values.resources | toYaml | indent 12 }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: configuration, mountPath: /configuration, readOnly: true}
            - {name: state, mountPath: /state}
      volumes:
        - name: configuration
          configMap: {name: {{ .Release.Name }}-config}
        - name: state
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim: {claimName: {{ .Release.Name }}-state}
          {{- else }}
          emptyDir: {sizeLimit: {{ .Values.persistence.size }}}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  selector: {app: {{ .Release.Name }}}
  ports: [{port: 8080, targetPort: 8080}]
