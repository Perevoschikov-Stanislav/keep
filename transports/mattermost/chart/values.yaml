image:
  repository: keep-mm-bridge
  tag: transport-v1
  pullPolicy: IfNotPresent
configuration:
  schema_version: 1
  tenant_id: keep
  transport_ref: chat-bridge
  keep_api_url: http://keep-backend:8080
  keep_ui_url: https://keep.example.org
  mattermost_url: https://chat.example.org
  transport_token_ref: env:BRIDGE_TRANSPORT_TOKEN
  service_token_ref: env:KEEP_BRIDGE_SERVICE_TOKEN
  mattermost_token_ref: env:MM_BOT_TOKEN
  state_db: /state/transport.db
  timeout_seconds: 10
  reconcile_interval_seconds: 10
  recovery_page_size: 100
  recovery_max_pages: 10
  max_body_bytes: 524288
  destinations: {}
secretRefs:
  transport: {name: keep-bridge-transport, key: token}
  service: {name: keep-bridge-client, key: token}
  mattermost: {name: keep-mm-bot, key: MM_BOT_TOKEN}
persistence:
  enabled: true
  size: 1Gi
  storageClassName: null
resources:
  requests: {cpu: 25m, memory: 64Mi}
  limits: {memory: 256Mi}
